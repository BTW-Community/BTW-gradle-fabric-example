plugins {
//    id "fabric-loom" version "${loom_version}"
//    id "legacy-looming" version "${loom_version}" // Version must be the same as fabric-loom's
    id "maven-publish"
}

apply plugin: "net.fabricmc.fabric-loom-remap"
apply plugin: "legacy-looming"
apply plugin: "btw-gradle"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    // Uncomment when using Legacy Fabric API
    // maven { url = "https://maven.bawnorton.com/releases" }
}

loom {
}

legacyLooming {
}

btw {
    version = project.btw_version
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "btw.community:mappings:1.0.3"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Better Than Wolves already provides a lot of hooks, but you can additionally rely on Legacy Fabric own API if you wish to.
    // Legacy Fabric API provides hooks for events, item registration, and more. As most mods will need this, it's included by default.
    // If you know for a fact you don't, it's not required and can be safely removed.
    // Check availability for your MC version at https://legacyfabric.net/usage.html
    // modImplementation "net.legacyfabric.legacy-fabric-api:legacy-fabric-api:1.13.2+1.6.4"

    // Uncomment when using Legacy Fabric API
    // modImplementation "maven.modrinth:legacy-fabric-api-fixes-btw:1.1.0"
    // modRuntimeOnly("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0")

    // You can retrieve a specific api module using this notation.
    // modImplementation(legacy.apiModule("legacy-fabric-item-groups-v1", project.fabric_version))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    it.options.encoding = "UTF-8"
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
